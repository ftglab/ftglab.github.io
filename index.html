<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTG</title>
    <style>
        /* All design is hardcoded here, no external links or dependencies */
        body {
            background-color: #f8fafc;
            color: #334155;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 16px;
        }
        .card {
            max-width: 640px;
            width: 100%;
            background-color: #F9FAFB;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid #f1f5f9;
            overflow: hidden;
        }
        .header-image {
            height: 192px;
            background-color: #e2e8f0;
            overflow: hidden;
        }
        .header-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .content {
            padding: 32px;
            text-align: center;
        }
        h1 {
            font-size: 30px;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }
        .profession {
            color: #4f46e5;
            font-weight: 600;
            font-size: 18px;
            margin: 0 0 24px 0;
        }
        .bio {
            color: #475569;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .video-container {
            margin-bottom: 32px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000000;
            max-width: 384px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }
        video {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <!-- Local image from your GitHub repository -->
        <div class="header-image">
            <img id="profile-image" src="FTG.webp" alt="Presentation:">
        </div>

        <div class="content">
            <h1 id="name">FTG Lab</h1>
            <p id="profession" class="profession">Game development</p>
            
            <div id="bio" class="bio">
                FEATURES GAMES LAB
            </div>

            <!-- Local video from your GitHub repository -->
            <div class="video-container">
                <video id="presentation-video" controls>
                    <source src="video.webm" type="video/webm">
                    No video supported.
                </video>
            </div>
        </div>
    </div>

</body>
</html>
